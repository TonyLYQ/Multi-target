      .transition-label { font: 600 15px Arial, Helvetica, sans-serif; fill: #475569; text-anchor: middle; }
      .background-dot { fill: #D9DEE5; }
      .prior-dot { fill: #91A4B8; }
      .rich-condition-dot { fill: #7667B1; }
      .sparse-condition-dot { fill: #168FA3; }
    </style>

