  <title id="figure-title">SPRi-enabled expansion of target-conditioned chemical exploration</title>
  <desc id="figure-desc">Four aligned chemical-space panels compare the pretrained prior, a data-rich target condition, a sparse target condition, and the expanded conditional space after SPRi data enrichment.</desc>

