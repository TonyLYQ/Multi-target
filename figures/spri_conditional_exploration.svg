  <rect width="2180" height="620" fill="#FFFFFF"/>

  <!-- A. Broad pretrained chemical prior -->
  <g id="panel-a" transform="translate(30 45)">
    <text class="panel-letter" x="0" y="30">A</text>
    <g transform="translate(0 35)" class="prior-dot" opacity="0.78">
      <use xlink:href="#chemical-space-cloud"/>
    </g>
    <text class="caption" x="210" y="500">Broad pretrained chemical prior</text>
  </g>

