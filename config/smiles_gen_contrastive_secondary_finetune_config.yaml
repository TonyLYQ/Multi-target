seed: 42

# Load the COMPLETE first-stage model (GPT, cross-attention and target encoder).
pretrained:
  output_dir: outputs/smiles_gen_finetune_MTD
  resolved_config: resolved_config.yaml
  checkpoint: checkpoints/best_state_dict.pt

data:
  contrastive_csv_path: contrastive_data/spri_contrastive_128.csv
  mtd_csv_path: finetuning_data/MTD_combined.csv
  mtd_split_index_path: outputs/smiles_gen_finetune_MTD/splits/positive_split_indices.pt
  # Archived first-stage available proteins; rebuild EXACT record order before indexing.
  mtd_protein_manifest_path: ESMC_data/filenames.txt
  protein_dir: ESMC_data
  vocab_path: ZINC_data/zinc_vocab.csv  # Must match the first-stage token IDs.
  max_length: 128
  split_ratio: [0.8, 0.1, 0.1]
  split_method: molecule  # molecule or scaffold; all rows of a structure stay together.
  invalid_smiles_policy: skip  # skip (with audit CSV) or error; never UNK/truncate.
  exclude_spri_holdout_from_mtd: true

training:
  output_dir: outputs/smiles_gen_contrastive_secondary_finetune
  # Counts are PER DEVICE, PER MICRO-BATCH, not numbers of forward branches.
  # 32 contrastive groups => 96 conditional sequences; 32 MTD => 32 sequences.
  contrastive_batch_size: 32
  mtd_batch_size: 32
  per_device_eval_batch_size: 32
  gradient_accumulation_steps: 1
  spri_tf_loss_weight: 0.5
  contrastive_loss_weight: 0.1
  contrastive_warmup_ratio: 0.1  # Ramp 0 -> contrastive_loss_weight.
  enforce_pn_gt_nn: false
  contrastive_beta: 1.0  # softplus(beta * (margin - (preferred - rejected)))
  contrastive_margin: 0.0
  gpt_learning_rate: 1.0e-6
  cross_attention_learning_rate: 1.0e-5
  target_encoder_learning_rate: 1.0e-5
  betas: [0.9, 0.95]
  eps: 1.0e-8
  weight_decay: 0.01
  max_epochs: 5
  warmup_ratio: 0.05
  max_grad_norm: 1.0
  mixed_precision: bf16
  num_workers: 0
  logging_steps: 1
  checkpoint_steps: 25
  save_state_dict_only: true

early_stopping:
  patience: 10
  min_delta: 0.0
